services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    container_name: web
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - ./webapp:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - internal
      - mes-network
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  db:
    image: postgres:18.0
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: orchestrator
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - 5001:5000
    volumes:
      - ./components:/components
    networks:
      - mes-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  whisperer:
    build:
      context: .
      dockerfile: docker/Dockerfile.whisperer
    container_name: whisperer
    restart: unless-stopped
    environment:
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - 5002:5000
    networks:
      - mes-network
      - machines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:

networks:
  internal:
  mes-network:
  machines:
    name: machines
    driver: bridge
    attachable: true
