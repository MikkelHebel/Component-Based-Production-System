services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    container_name: web
    ports:
      - 8000:8000
    volumes:
      - ./webapp:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - internal
      - mes-network
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:18.0
    container_name: Postgres
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal

  orchestrator:
    networks:
      - mes-network

  whisperer:
    networks:
      - mes-network
      - machines

volumes:
  pgdata:

networks:
  internal:
  mes-network:
  machines:
    driver: bridge
    attachable: true
