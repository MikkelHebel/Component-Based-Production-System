services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    container_name: web
    ports:
      - 8000:8000
    volumes:
      - ./webapp:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - internal
      - mes-network
    depends_on:
      - db
    env_file:
      - .env

  db:
    image: postgres:18.0
    container_name: postgres
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - internal

  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: orchestrator
    environment:
      - ASPNETCORE_URLS=http://+:5000
    ports:
      - 5001:5000
    volumes:
      - ./components:/components
    networks:
      - mes-network

  whisperer:
    build:
      context: .
      dockerfile: docker/Dockerfile.whisperer
    container_name: whisperer
    environment:
      - ASPNETCORE_URLS=http://+:5001
    ports:
      - 5002:5000
    networks:
      - mes-network
      - machines

volumes:
  pgdata:

networks:
  internal:
  mes-network:
  machines:
    driver: bridge
    attachable: true
